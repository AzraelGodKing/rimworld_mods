# =============================================================================
# Release & Publish — RimWorld mods (GitHub Releases + Nexus)
# Pattern from SunhavenMod Release & Publish: dispatch → validate → version gate →
# build → zip → optional GitHub tag Name-vVERSION → optional Nexus file version.
#
# Version comes from each mod's About.xml modVersion (not a central versions.json).
# Changelog for the release is the current-version block in About/changelog.txt.
# Docs-site rolling zips stay on the `latest` tag (Build mod DLLs workflow).
# That workflow also keeps immutable `downloads-YYYY-MM-DD-<sha7>` snapshots (AZR-50).
# =============================================================================
name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build + zip artifact only; no GitHub Release or Nexus)"
        required: true
        type: boolean
        default: true
      mod:
        description: "Which mod to release"
        required: true
        type: choice
        options:
          - all
          - homesteader
          - stormproof
          - strata
          - nemesis
          - deepcolony
          - datenight
          - niceties
      create_github_release:
        description: "Create a versioned GitHub Release (does not replace the rolling latest tag)"
        required: true
        type: boolean
        default: true
      publish_nexus:
        description: "Upload the zip to Nexus Mods (page version, archive old Main, Vortex default, Changelog tab)"
        required: false
        type: boolean
        default: false
      release_anyway:
        description: "Ignore GitHub tag + Nexus version compare (re-publish even if About.xml is already on GitHub and/or Nexus)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-mod-${{ github.event.inputs.mod }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  setup:
    name: Mod matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_mods: ${{ steps.set.outputs.has_mods }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate XML, texPaths, and Keyed parity
        run: python3 scripts/validate_mods.py
      - id: set
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MOD="${{ github.event.inputs.mod }}"
          if [ "$MOD" = "all" ]; then
            KEYS="$(jq -r '[.[] | select(.publish != false) | .modKey] | join(",")' scripts/matrix/mod-matrix.json)"
          else
            PUBLISH="$(jq -r --arg k "$MOD" '.[] | select(.modKey == $k) | .publish' scripts/matrix/mod-matrix.json)"
            if [ "$PUBLISH" = "false" ]; then
              echo "::error::$MOD is not release-ready (publish=false). Living World and Azrael stay in-repo only."
              exit 1
            fi
            KEYS="$MOD"
          fi
          python3 scripts/release_version_gate.py \
            --select-new \
            --keys "$KEYS" \
            --repo "${{ github.repository }}" \
            --api-url "${{ github.api_url }}" \
            --create-github-release "${{ github.event.inputs.create_github_release }}" \
            --publish-nexus "${{ github.event.inputs.publish_nexus }}" \
            --dry-run "${{ github.event.inputs.dry_run }}" \
            --release-anyway "${{ github.event.inputs.release_anyway }}" \
            --github-output

  build:
    name: Build and pack
    needs: setup
    if: needs.setup.outputs.has_mods == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve paths
        id: row
        run: |
          set -euo pipefail
          ROW="$(jq -c --arg k "${{ matrix.mod }}" '.[] | select(.modKey == $k)' scripts/matrix/mod-matrix.json)"
          echo "mod_dir=$(echo "$ROW" | jq -r '.modDir')" >> "$GITHUB_OUTPUT"
          echo "dll_name=$(echo "$ROW" | jq -r '.dllName')" >> "$GITHUB_OUTPUT"
          echo "csproj=$(echo "$ROW" | jq -r '.csproj')" >> "$GITHUB_OUTPUT"
          echo "configuration=$(echo "$ROW" | jq -r '.configuration // empty')" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(echo "$ROW" | jq -r '.zipName')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -euo pipefail
          CFG="${{ steps.row.outputs.configuration }}"
          if [ -n "$CFG" ]; then
            dotnet build "${{ steps.row.outputs.csproj }}" -c "$CFG" --nologo
          else
            dotnet build "${{ steps.row.outputs.csproj }}" --nologo
          fi

      - name: Pack zip
        run: bash scripts/pack_mod.sh "${{ steps.row.outputs.mod_dir }}" "${{ steps.row.outputs.zip_name }}" "${{ steps.row.outputs.dll_name }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.mod }}
          path: dist/${{ steps.row.outputs.zip_name }}.zip
          if-no-files-found: error

  release:
    name: GitHub + Nexus
    needs: [setup, build]
    if: needs.setup.outputs.has_mods == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mod: ${{ fromJson(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/reusable-release-mod.yml
    with:
      mod: ${{ matrix.mod }}
      dry_run: ${{ github.event.inputs.dry_run }}
      create_github_release: ${{ github.event.inputs.create_github_release }}
      publish_nexus: ${{ github.event.inputs.publish_nexus }}
      release_anyway: ${{ github.event.inputs.release_anyway }}
    secrets:
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
