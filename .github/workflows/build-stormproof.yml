name: Build Stormproof DLL

on:
  push:
    paths:
      - "Stormproof/Source/**"
      - ".github/workflows/build-stormproof.yml"
  pull_request:
    paths:
      - "Stormproof/Source/**"
      - ".github/workflows/build-stormproof.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build Stormproof/Source/Stormproof.csproj -c Release
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stormproof-Assemblies
          path: Stormproof/Assemblies/Stormproof.dll
