name: Build mod DLLs

# On main only: rebuild Homesteader / Strata / Stormproof assemblies and refresh
# docs/downloads/*.zip for the GitHub Pages download buttons. Assemblies/*.dll
# stay gitignored — only the download zips are committed.

on:
  push:
    branches: [main]
    paths:
      - "Homesteader/Source/**"
      - "Strata/Source/**"
      - "Stormproof/Source/**"
      - "build_downloads.ps1"
      - ".github/workflows/build-mods.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mods-main
  cancel-in-progress: true

jobs:
  build-and-pack:
    name: Build DLLs and pack site downloads
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Homesteader
        run: dotnet build Homesteader/Source/Homesteader.csproj -c Release --nologo

      - name: Build Strata
        run: dotnet build Strata/Source/Strata.csproj -c Release --nologo

      - name: Build Stormproof
        run: dotnet build Stormproof/Source/Stormproof.csproj -c Release --nologo

      - name: Pack docs/downloads zips (with DLLs)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          for mod in Homesteader Stormproof Strata; do
            zip_path="docs/downloads/${mod}.zip"
            git archive --format=zip -o "$zip_path" HEAD "$mod"
            dll="${mod}/Assemblies/${mod}.dll"
            if [[ ! -f "$dll" ]]; then
              echo "Missing $dll" >&2
              exit 1
            fi
            # Inject / replace assembly inside the archive (paths use forward slashes).
            zip -u "$zip_path" "$dll"
            echo "${mod}: $(du -h "$zip_path" | cut -f1)"
          done

      - name: Upload download zips
        uses: actions/upload-artifact@v4
        with:
          name: site-downloads
          path: docs/downloads/*.zip
          if-no-files-found: error

      - name: Commit download zips if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/Homesteader.zip docs/downloads/Stormproof.zip docs/downloads/Strata.zip
          if git diff --staged --quiet; then
            echo "Download zips unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh site download zips [skip ci]"
          git push origin HEAD:main
