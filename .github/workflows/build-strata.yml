name: Build Strata DLL

on:
  push:
    paths:
      - "Strata/Source/**"
      - ".github/workflows/build-strata.yml"
  pull_request:
    paths:
      - "Strata/Source/**"
      - ".github/workflows/build-strata.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build Strata/Source/Strata.csproj -c Release
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Strata-Assemblies
          path: Strata/Assemblies/Strata.dll
