name: Build mod DLLs

# Builds Homesteader, Strata, and Stormproof assemblies whenever Source changes.
# Uploads DLLs as workflow artifacts. Assemblies are gitignored (build locally or
# download from Actions).

on:
  push:
    paths:
      - "Homesteader/Source/**"
      - "Strata/Source/**"
      - "Stormproof/Source/**"
      - ".github/workflows/build-mods.yml"
  pull_request:
    paths:
      - "Homesteader/Source/**"
      - "Strata/Source/**"
      - "Stormproof/Source/**"
      - ".github/workflows/build-mods.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mods-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.mod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mod: Homesteader
            project: Homesteader/Source/Homesteader.csproj
            dll: Homesteader/Assemblies/Homesteader.dll
          - mod: Strata
            project: Strata/Source/Strata.csproj
            dll: Strata/Assemblies/Strata.dll
          - mod: Stormproof
            project: Stormproof/Source/Stormproof.csproj
            dll: Stormproof/Assemblies/Stormproof.dll
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build ${{ matrix.mod }}
        run: dotnet build "${{ matrix.project }}" -c Release --nologo

      - name: Upload ${{ matrix.mod }} DLL
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-Assemblies
          path: ${{ matrix.dll }}
          if-no-files-found: error
