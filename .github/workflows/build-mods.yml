name: Build mod DLLs

# Build Homesteader / Strata / Stormproof / Nemesis / DateNight / LivingWorld /
# Deep Colony on push to main and on PRs.
# On main (and workflow_dispatch): pack download zips with injected DLLs and publish
# them to the rolling "latest" GitHub Release for the docs site buttons.
# Assemblies/*.dll stay gitignored — zips are never committed.
# Nemesis / Deep Colony stay Workshop-first (compile-only; no docs zip).

on:
  push:
    branches: [main]
    paths:
      - "Homesteader/Source/**"
      - "Strata/Source/**"
      - "Stormproof/Source/**"
      - "Nemesis/Source/**"
      - "DateNight/Source/**"
      - "LivingWorld/Source/**"
      - "Deep Colony/Source/**"
      - "scripts/build_downloads.ps1"
      - ".github/workflows/build-mods.yml"
  pull_request:
    paths:
      - "Homesteader/Source/**"
      - "Strata/Source/**"
      - "Stormproof/Source/**"
      - "Nemesis/Source/**"
      - "DateNight/Source/**"
      - "LivingWorld/Source/**"
      - "Deep Colony/Source/**"
      - "scripts/build_downloads.ps1"
      - ".github/workflows/build-mods.yml"
  workflow_dispatch:

# Default read-only; publishing job elevates to write only off PRs.
permissions:
  contents: read

concurrency:
  group: build-mods-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-pack:
    name: Build DLLs${{ github.event_name == 'pull_request' && '' || ' and publish downloads' }}
    runs-on: ubuntu-latest
    # Job elevates for release/tag push on main; publish steps stay gated off pull_request.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so we can force-move the rolling `latest` tag.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Homesteader
        run: dotnet build Homesteader/Source/Homesteader.csproj -c Release --nologo

      - name: Build Strata
        run: dotnet build Strata/Source/Strata.csproj -c Release --nologo

      - name: Build Stormproof
        run: dotnet build Stormproof/Source/Stormproof.csproj -c Release --nologo

      - name: Build Nemesis
        run: dotnet build Nemesis/Source/Nemesis.csproj -c Release --nologo

      - name: Build DateNight
        run: dotnet build DateNight/Source/DateNight.csproj -c Release --nologo

      - name: Build LivingWorld
        run: dotnet build LivingWorld/Source/LivingWorld.csproj -c Release --nologo

      - name: Build Deep Colony
        run: dotnet build "Deep Colony/Source/DeepColony.csproj" -c Release --nologo

      - name: Pack docs/downloads zips (with DLLs)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          # Nemesis / Deep Colony Workshop-first; Homesteader / Stormproof / Strata / DateNight / LivingWorld zip for docs.
          for mod in Homesteader Stormproof Strata DateNight LivingWorld; do
            zip_path="docs/downloads/${mod}.zip"
            git archive --format=zip -o "$zip_path" HEAD "$mod"
            dll="${mod}/Assemblies/${mod}.dll"
            if [[ ! -f "$dll" ]]; then
              echo "Missing $dll" >&2
              exit 1
            fi
            # Inject / replace assembly inside the archive (paths use forward slashes).
            zip -u "$zip_path" "$dll"
            # Drop draft Workshop preview options from the public zip.
            if [[ "$mod" == "DateNight" ]]; then
              zip -d "$zip_path" "DateNight/About/preview-options/*" 2>/dev/null || true
            fi
            echo "${mod}: $(du -h "$zip_path" | cut -f1)"
          done

      - name: Upload download zips (artifact)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-downloads
          path: docs/downloads/*.zip
          if-no-files-found: error

      - name: Point latest tag at this SHA
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish download zips to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest mod downloads
          body: |
            Packaged mod folders with CI-built assemblies for the docs site download buttons.
            Rebuilt on each relevant push to `main` (rolling tag — assets are overwritten).
            Nemesis / Deep Colony are Workshop-first; Date Night / Living World ship docs download zips.
          files: |
            docs/downloads/Homesteader.zip
            docs/downloads/Stormproof.zip
            docs/downloads/Strata.zip
            docs/downloads/DateNight.zip
            docs/downloads/LivingWorld.zip
          make_latest: true
          fail_on_unmatched_files: true
          # Replace assets when the rolling `latest` tag is republished.
          overwrite_files: true

      # softprops does not delete omitted assets — strip leftover Workshop-first zips.
      - name: Remove Nemesis.zip / DeepColony.zip from latest release if present
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          assets_json="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/latest")"
          for name in Nemesis.zip DeepColony.zip; do
            asset_id="$(printf '%s' "$assets_json" | python3 -c \
              'import json,sys; a=json.load(sys.stdin).get("assets",[]); print(next((x["id"] for x in a if x["name"]==sys.argv[1]), ""))' \
              "$name")"
            if [[ -z "$asset_id" ]]; then
              echo "$name not on latest release — nothing to delete."
              continue
            fi
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            echo "Deleted $name (asset id $asset_id)."
          done
