name: Build mod DLLs

# Build Homesteader / Strata / Stormproof / Nemesis / DateNight / LivingWorld /
# Deep Colony / Azrael / Niceties on push to main and on PRs.
# On main (and workflow_dispatch): pack download zips with injected DLLs and publish
# them to the rolling "latest" GitHub Release for the docs site buttons.
# Also cuts an immutable prerelease tag downloads-YYYY-MM-DD-<sha7> so old zips stay
# downloadable (AZR-50). Assemblies/*.dll stay gitignored — zips are never committed.

on:
  push:
    branches: [main]
    paths:
      - "Homesteader/Source/**"
      - "Strata/Source/**"
      - "Stormproof/Source/**"
      - "Nemesis/Source/**"
      - "DateNight/Source/**"
      - "LivingWorld/Source/**"
      - "Deep Colony/Source/**"
      - "Azrael/Source/**"
      - "Niceties/Source/**"
      - "scripts/build_downloads.ps1"
      - "scripts/pack_mod.sh"
      - "scripts/validate_mods.py"
      - ".gitattributes"
      - "**/*.xml"
      - ".github/workflows/build-mods.yml"
  pull_request:
    paths:
      - "Homesteader/Source/**"
      - "Strata/Source/**"
      - "Stormproof/Source/**"
      - "Nemesis/Source/**"
      - "DateNight/Source/**"
      - "LivingWorld/Source/**"
      - "Deep Colony/Source/**"
      - "Azrael/Source/**"
      - "Niceties/Source/**"
      - "scripts/build_downloads.ps1"
      - "scripts/pack_mod.sh"
      - "scripts/validate_mods.py"
      - ".gitattributes"
      - "**/*.xml"
      - ".github/workflows/build-mods.yml"
  workflow_dispatch:

# Default read-only; publishing job elevates to write only off PRs.
permissions:
  contents: read

concurrency:
  group: build-mods-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-pack:
    name: Build DLLs${{ github.event_name == 'pull_request' && '' || ' and publish downloads' }}
    runs-on: ubuntu-latest
    # Job elevates for release/tag push on main; publish steps stay gated off pull_request.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # History + tags: move rolling `latest`, skip snapshot if that SHA was already tagged.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate XML, texPaths, and Keyed parity
        run: python3 scripts/validate_mods.py

      - name: Build Homesteader
        run: dotnet build Homesteader/Source/Homesteader.csproj -c Release --nologo

      - name: Build Strata
        run: dotnet build Strata/Source/Strata.csproj -c Release --nologo

      - name: Build Stormproof
        run: dotnet build Stormproof/Source/Stormproof.csproj -c Release --nologo

      - name: Build Nemesis
        run: dotnet build Nemesis/Source/Nemesis.csproj -c Release --nologo

      - name: Build DateNight
        run: dotnet build DateNight/Source/DateNight.csproj -c Release --nologo

      - name: Build LivingWorld
        run: dotnet build LivingWorld/Source/LivingWorld.csproj -c Release --nologo

      - name: Build Deep Colony
        run: dotnet build "Deep Colony/Source/DeepColony.csproj" -c Release --nologo

      - name: Build Azrael
        run: dotnet build Azrael/Source/Azrael.csproj -c Release --nologo

      - name: Build Niceties
        run: dotnet build Niceties/Source/Niceties.csproj -c Release --nologo

      - name: Pack docs/downloads zips (with DLLs)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          bash scripts/pack_mod.sh Homesteader Homesteader Homesteader docs/downloads
          bash scripts/pack_mod.sh Stormproof Stormproof Stormproof docs/downloads
          bash scripts/pack_mod.sh Strata Strata Strata docs/downloads
          bash scripts/pack_mod.sh Nemesis Nemesis Nemesis docs/downloads
          bash scripts/pack_mod.sh "Deep Colony" DeepColony DeepColony docs/downloads
          bash scripts/pack_mod.sh DateNight DateNight DateNight docs/downloads
          bash scripts/pack_mod.sh Niceties Niceties Niceties docs/downloads

      - name: Upload download zips (artifact)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-downloads
          path: docs/downloads/*.zip
          if-no-files-found: error

      - name: Point latest tag at this SHA
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish download zips to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest mod downloads
          body: |
            Packaged mod folders with CI-built assemblies for the docs site download buttons.
            Rebuilt on each relevant push to `main` (rolling tag — assets are overwritten).
            Includes Homesteader, Stormproof, Strata, Nemesis, DeepColony, DateNight, and Niceties.
            Living World and Azrael are in-repo only (not release-ready).
            Immutable copies of the same zips are tagged `downloads-YYYY-MM-DD-<sha7>` (prerelease).
            Shipped Workshop versions use Release & Publish (`Homesteader-v1.0.2`, …). See docs/VERSIONING.md.
          files: |
            docs/downloads/Homesteader.zip
            docs/downloads/Stormproof.zip
            docs/downloads/Strata.zip
            docs/downloads/Nemesis.zip
            docs/downloads/DeepColony.zip
            docs/downloads/DateNight.zip
            docs/downloads/Niceties.zip
          make_latest: true
          fail_on_unmatched_files: true
          # Replace assets when the rolling `latest` tag is republished.
          overwrite_files: true

      - name: Snapshot tag name
        if: github.event_name != 'pull_request'
        id: snap
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          SHORT="${GITHUB_SHA:0:7}"
          TAG="downloads-${DATE}-${SHORT}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish immutable download snapshot
        if: github.event_name != 'pull_request' && steps.snap.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.snap.outputs.tag }}
          name: Downloads ${{ steps.snap.outputs.date }} (${{ github.sha }})
          body: |
            Immutable snapshot of the docs-site zips from `${{ github.sha }}`.
            Does not replace the rolling `latest` tag.
            Player-facing `modVersion` is inside each zip's `About/About.xml`.
            Official shipped versions are `{ZipName}-v{modVersion}` from Release & Publish.
          files: |
            docs/downloads/Homesteader.zip
            docs/downloads/Stormproof.zip
            docs/downloads/Strata.zip
            docs/downloads/Nemesis.zip
            docs/downloads/DeepColony.zip
            docs/downloads/DateNight.zip
            docs/downloads/Niceties.zip
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: false
