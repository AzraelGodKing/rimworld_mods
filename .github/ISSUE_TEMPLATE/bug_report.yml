name: Bug report
description: Report a bug with one of the RimWorld mods in this repo.
title: "[Mod] "
labels: ["bug"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      description: Which mod is affected?
      options:
        - Strata
        - Deep Colony
        - Homesteader
        - Stormproof
        - Date Night
        - Nemesis
        - Other
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: Version shown in the mod settings or About page.
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: input
    id: rimworld-version
    attributes:
      label: RimWorld version
      description: Game version from the main menu.
      placeholder: e.g. 1.5.4104
    validations:
      required: true

  - type: checkboxes
    id: dlc
    attributes:
      label: Installed DLC
      description: Check all DLC you have installed.
      options:
        - label: Royalty
        - label: Ideology
        - label: Biotech
        - label: Anomaly
        - label: Odyssey

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Load save with …
        2. Click …
        3. See error
    validations:
      required: true

  - type: dropdown
    id: only-this-mod
    attributes:
      label: Happens with only this mod loaded?
      options:
        - "Yes"
        - "No"
        - Unsure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant log output or a link to the full log.
      placeholder: Player.log or HugsLib log (Ctrl+F12)
      render: text
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other mods that might matter
      description: List any mods you think could be related (optional).
    validations:
      required: false
